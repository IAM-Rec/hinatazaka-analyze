            category: "歌词解读",
            excerpt: `这首歌是日向坂46上村ひなの演唱的一首关于「自我认知崩塌」的哲学独白。歌词讲述了一个人向所有人宣称自己有「最爱的一本书」，却完全想不起书名——最终发现那本书根本不存在。

本文将从四个维度进行深度解剖：叙事结构、核心隐喻、心理动机、思想内核，并进一步探讨这首歌与偶像工业之间惊人的互文关系。`,

            // 完整内容（点击"阅读全文"后展开）
            fullContent: `
            <p style="font-size:1.05rem; font-weight:600; color:var(--primary-dark); margin-bottom:1rem;">🎯 引论：偶像工业与"自欺"的结构性同构</p>

            <p>在聊这首歌之前，我们需要先建立一个大前提——<strong>偶像工业的本质，就是一场集体性的"自欺"契约。</strong></p>

            <ul style="margin:0.8rem 0 0.8rem 1.8rem; line-height:2;">
                <li><strong>运营方</strong>提供"触手可及的梦想"和"成长中的未完成态"</li>
                <li><strong>偶像本人</strong>扮演那个"正在努力成为理想自我"的角色</li>
                <li><strong>粉丝</strong>则自愿相信这个虚构，从中获得情感投射和慰藉</li>
            </ul>

            <p>三方都心知肚明"这只是一场演出"，但都默契地不戳破。这就是萨特所说的<strong>"集体自欺"</strong>——一种被制度化、商业化、合法化的自我欺骗。</p>

            <p>而上村ひなの作为日向坂46的现役偶像，唱出这首歌，本身就构成了一枚<strong>投向自己职业根基的回旋镖</strong>。</p>

            <hr style="margin:1.5rem 0; border:1px dashed var(--primary-light);" />

            <p style="font-size:1.05rem; font-weight:600; color:var(--primary-dark); margin-bottom:1rem;">📖 一、叙事结构：一场"寻找"引发的精神考古</p>

            <p>歌词遵循一个清晰的<strong>侦探式叙事线</strong>，但调查对象不是案件，而是"自我"。</p>

            <p><strong>1. 案发（第一段）</strong>：宣称"最喜欢"的书，书名却完全想不起来。结论直给——<strong>"其实没那么喜欢"</strong>。这是对表层意识的第一次背叛。</p>

            <p><strong>2. 追查动机（第二、三段）</strong>：为什么我们会虚构"喜欢"？因为现实中的"理想自我"像滑溜的鱼，永远抓不住。所谓的理想，只是<strong>"让人不放弃的胡萝卜"</strong>，是被基因改造过的虚假欲望。</p>

            <p><strong>3. 现场勘查（念白部分）</strong>：这是全曲的<strong>"高光转折"</strong>。记住封面、字体，却忘了标题；翻遍老家，书根本不存在。这暴露了真相：记忆的细节越清晰（包装），核心内容（本质）越空洞。</p>

            <p><strong>4. 结案陈词（结尾）</strong>：那本书是<strong>"想象中的记忆"</strong>，是自行编造的"理想的我"。最后反复质问"好きじゃないのか"（是不是不喜欢），终于承认——<strong>我渴望的根本不是这本书，而是"拥有最爱的书"的那个自己。</strong></p>

            <hr style="margin:1.5rem 0; border:1px dashed var(--primary-light);" />

            <p style="font-size:1.05rem; font-weight:600; color:var(--primary-dark); margin-bottom:1rem;">🔑 二、核心隐喻："小说"与"书名"的二元对立</p>

            <table style="width:100%; border-collapse:collapse; margin:0.8rem 0; font-size:0.95rem;">
                <tr style="background:var(--primary-light);">
                    <th style="padding:10px 16px; border:1px solid #e0c8c8; text-align:left;">元素</th>
                    <th style="padding:10px 16px; border:1px solid #e0c8c8; text-align:left;">象征意义</th>
                    <th style="padding:10px 16px; border:1px solid #e0c8c8; text-align:left;">特征</th>
                </tr>
                <tr>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;"><strong>"小说"本身</strong></td>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;">理想化的自我形象（那个"想成为的人"）</td>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;">被宣称、被展示给他人看的外壳</td>
                </tr>
                <tr style="background:#f8f0ee;">
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;"><strong>"书名"</strong></td>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;">那个形象的核心本质/真实动机</td>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;">本应脱口而出，却空洞、被遗忘</td>
                </tr>
                <tr>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;"><strong>"封面和字体"</strong></td>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;">外在的人设包装（品味、谈吐、社交形象）</td>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;">记得很清楚，因为那是给别人看的</td>
                </tr>
                <tr style="background:#f8f0ee;">
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;"><strong>"书不存在"</strong></td>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;">理想自我的虚构性</td>
                    <td style="padding:10px 16px; border:1px solid #e0c8c8;">从一开始就是"想象中"的产物</td>
                </tr>
            </table>

            <p><strong>残酷的真相是</strong>：我们往往把"记得封面"误认为"读过这本书"，就像把"经营人设"误认为"活出自我"。书名（本质）的缺失，暴露了全书（整个人设）的虚无。</p>

            <hr style="margin:1.5rem 0; border:1px dashed var(--primary-light);" />

            <p style="font-size:1.05rem; font-weight:600; color:var(--primary-dark); margin-bottom:1rem;">🧠 三、心理动机：为什么我们要"假装喜欢"？</p>

            <p><strong>1. 为了迎合社会期待</strong><br />"知性的、时髦的形象"——这不是自发的喜好，而是为了<strong>操纵他人眼中的印象</strong>。通过宣称"喜欢某本书"，我们在给自己贴标签，换取社交认同。</p>

            <p><strong>2. 为了逃避真实的自我审视</strong><br />"一边妥协一边死要面子""把从前的谎言继续贯彻下去"——因为承认"我没那么喜欢"就等于承认"我成不了理想中的自己"。为了不面对这个痛苦，我们选择<strong>继续演戏</strong>，哪怕漏洞百出。</p>

            <p><strong>3. 为了填补存在性空虚</strong><br />"渴望某个谁也不知道的东西"——这句话暴露了根源：我们虚构"最爱"，是因为内心有个空洞，需要用一个<strong>"独一无二的执着"</strong>来填满。即使那个东西不存在，捏造一个也比面对空虚要好。</p>

            <hr style="margin:1.5rem 0; border:1px dashed var(--primary-light);" />

            <p style="font-size:1.05rem; font-weight:600; color:var(--primary-dark); margin-bottom:1rem;">💭 四、思想内核：成长的本质是"幻灭的堆叠"</p>

            <p>这首歌的深度在于，它把<strong>"忘记书名"</strong>拔高到了<strong>"成人式的觉醒"</strong>。</p>

            <p><strong>关于"喜欢"的祛魅</strong>：真正的喜欢是不需要用力记住的。当你需要"宣称"你喜欢什么，那个东西往往只是你的欲望投射，而非本心。歌词反复强调的"好きじゃない"（不喜欢），不是否定那本书，而是<strong>否定那个用谎言堆砌出来的虚假自我</strong>。</p>

            <p><strong>关于"理想"的清算</strong>：歌词直言"理想是白日梦""人成不了想成为的自己"。这不是消极，而是一种<strong>残酷的清醒</strong>。长大成人的过程，就是不断发现"我以为的我"和"真实的我"之间那条鸿沟，并承认那条鸿沟无法弥合。</p>

            <p><strong>最后的悖论</strong>：结尾"僕は…好きじゃないんだ"（我就是不喜欢啊）——这句话看似是彻底的否定，但请注意：<strong>能如此清醒地否定虚假的"喜欢"，恰恰是"真实"的开始。</strong>承认那本书不存在，承认那个理想自己是编造的，主人公才第一次从"扮演"中走出来。</p>

            <hr style="margin:1.5rem 0; border:1px dashed var(--primary-light);" />

            <p style="font-size:1.05rem; font-weight:600; color:var(--primary-dark); margin-bottom:1rem;">🎭 五、互文性爆破：偶像唱"不喜欢"，意味着什么？</p>

            <p>这首歌最大的"冒犯性"在于副歌那句不断重复的<strong>"好きじゃないんだ"</strong>。</p>

            <p>在偶像文化的语法里，这是一个<strong>禁忌句式</strong>。因为偶像卖的就是"喜欢"——粉丝喜欢你，你要喜欢粉丝，你要喜欢舞台，你要喜欢这个工作。任何"不喜欢"的公开表达，都会被解读为对粉丝的背叛、对职业的不尊重、对"梦想"的亵渎。</p>

            <p>而这首歌允许一个偶像站在麦克风前，一遍又一遍地质问自己、最终承认：<strong>"我宣称喜欢的东西，我其实没那么喜欢。"</strong></p>

            <p>这里产生了<strong>三重互文性的爆破</strong>：</p>

            <ul style="margin:0.8rem 0 0.8rem 1.8rem; line-height:2;">
                <li><strong>歌词角色</strong>："我"发现最爱的小说并不存在 → 个人层面的自我幻灭</li>
                <li><strong>演唱者</strong>：上村ひなの以偶像身份唱出"我不喜欢" → 职业层面的禁忌打破</li>
                <li><strong>听众（粉丝）</strong>：正在听这首歌的人，恰恰是因为"喜欢"上村ひなの才在听 → 你喜欢的偶像正在唱"我不喜欢"，你的喜欢建立在什么之上？</li>
            </ul>

            <hr style="margin:1.5rem 0; border:1px dashed var(--primary-light);" />

            <p style="font-size:1.05rem; font-weight:600; color:var(--primary-dark); margin-bottom:1rem;">✍️ 六、秋元康的自反性写作</p>

            <p>这首歌的作词者是秋元康——日本偶像产业的<strong>最大操盘手</strong>。他亲手制造了数以百计的偶像人设，却写下这样一首<strong>拆穿"人设叙事"本身的歌</strong>，交给自己的偶像去唱。</p>

            <p>这是一种非常高级的<strong>"自反性"策略</strong>：</p>

            <ul style="margin:0.8rem 0 0.8rem 1.8rem; line-height:2;">
                <li><strong>表层</strong>：这是一首文艺的、有深度的、探讨自我认知的歌</li>
                <li><strong>中层</strong>：偶像唱了，显得"有思想深度"，提升了偶像的艺术人格</li>
                <li><strong>深层</strong>：歌的内容恰恰在解构"偶像人格"的虚构性——但你买票进来听的，就是这个虚构</li>
            </ul>

            <p>于是形成一个<strong>完美的闭环</strong>：你消费的是"拆穿虚构"的这个行为本身，而"拆穿虚构"被包装成了新的虚构商品。秋元康站在这个闭环之上，微笑着收钱。</p>

            <p><strong>这首歌批判"自欺"，但它的诞生和流通，本身就是"自欺"产业链上的一环。</strong></p>

            <hr style="margin:1.5rem 0; border:1px dashed var(--primary-light);" />

            <p style="font-size:1.05rem; font-weight:600; color:var(--primary-dark); margin-bottom:1rem;">🔮 最终追问：唱完这首歌之后，然后呢？</p>

            <p style="margin-top:0.8rem; color:var(--text-light);">而这，大概就是秋元康想让你花320日元下载这首歌时，真正买到的东西。😌</p>
            `,

            date: "2026-07-22",
            tags: ["上村ひなの", "秋元康", "自欺", "偶像工业", "哲学"]
        }
    ];

    // ============================================================
    //  🏷️ 分类配置
    // ============================================================
    const categories = ["全部", "歌词解读", "成员性格", "人际关系", "综艺分析", "专辑赏析"];

    // ============================================================
    //  ⚙️ 渲染逻辑
    // ============================================================
    let currentFilter = "全部";

    function render() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = articles.filter(a => {
            const matchCategory = currentFilter === "全部" || a.category === currentFilter;
            const matchSearch = !keyword ||
                a.title.toLowerCase().includes(keyword) ||
                a.excerpt.toLowerCase().includes(keyword) ||
                (a.tags && a.tags.some(t => t.toLowerCase().includes(keyword)));
            return matchCategory && matchSearch;
        });

        document.getElementById('totalCount').textContent = filtered.length;

        const list = document.getElementById('articleList');
        if (filtered.length === 0) {
            list.innerHTML = `<div class="empty"><div class="big">🌻</div><p>没有找到匹配的文章<br /><span style="font-size:0.85rem;color:var(--text-light);">试试其他关键词或分类</span></p></div>`;
            return;
        }

        list.innerHTML = filtered.map(a => {
            const hasFull = a.fullContent && a.fullContent.trim().length > 0;
            const contentId = `full-${a.id}`;
            return `
            <div class="card">
                <div class="card-header">
                    <h2>${a.title}</h2>
                    <span class="category-tag">${a.category}</span>
                </div>
                <div class="meta">
                    <span>📅 ${a.date}</span>
                    ${a.tags ? `<span>🏷️ ${a.tags.join(' · ')}</span>` : ''}
                </div>
                <div class="excerpt">
                    ${a.excerpt}
                    ${hasFull ? `
                        <div class="full-content" id="${contentId}">
                            ${a.fullContent}
                        </div>
                        <button class="read-more-btn" onclick="toggleFull('${contentId}', this)">📖 阅读全文 ↓</button>
                    ` : ''}
                </div>
            </div>
        `}).join('');
    }

    function toggleFull(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains('show')) {
            el.classList.remove('show');
            btn.textContent = '📖 阅读全文 ↓';
        } else {
            el.classList.add('show');
            btn.textContent = '📖 收起全文 ↑';
        }
    }

    function renderFilters() {
        const group = document.getElementById('filterGroup');
        group.innerHTML = categories.map(cat => `
            <button class="filter-btn ${cat === currentFilter ? 'active' : ''}"
                    onclick="currentFilter='${cat}';document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');render();">
                ${cat}
            </button>
        `).join('');
    }

    renderFilters();
    render();
</script>
